---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.19.0
  name: postgresrecoveries.nais.io
spec:
  group: nais.io
  names:
    categories:
    - nais
    kind: PostgresRecovery
    listKind: PostgresRecoveryList
    plural: postgresrecoveries
    singular: postgresrecovery
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.postgres
      name: Postgres
      type: string
    - jsonPath: .spec.pointInTime.sourcePostgres
      name: Source Postgres
      type: string
    - jsonPath: .spec.backup.backupName
      name: Backup
      type: string
    - jsonPath: .spec.pointInTime.targetTime
      name: Target Time
      type: string
    name: v1
    schema:
      openAPIV3Schema:
        description: |-
          PostgresRecovery is an ephemeral bootstrap contract created alongside a new
          Postgres when restoring from point-in-time recovery or a standalone
          PostgresBackup. Pgrator deletes it automatically once the new database has
          completed its first own backup and detached from the recovery source.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: PostgresRecoverySpec defines the immutable recovery source
              for a new Postgres.
            properties:
              backup:
                description: Backup initializes the target Postgres from a completed
                  standalone PostgresBackup.
                properties:
                  backupID:
                    description: BackupID is the Barman backup identifier to restore.
                    minLength: 1
                    type: string
                  backupName:
                    description: BackupName is the namespace-local PostgresBackup
                      resource name.
                    minLength: 1
                    type: string
                  backupUID:
                    description: BackupUID pins the UID of the PostgresBackup resource.
                    minLength: 1
                    type: string
                  bucketName:
                    description: BucketName is the team's disaster-recovery bucket
                      containing the copied backup.
                    minLength: 1
                    type: string
                  prefix:
                    description: Prefix is the isolated object prefix within BucketName
                      for this backup.
                    minLength: 1
                    type: string
                  serverName:
                    description: ServerName is the Barman server archive name within
                      Prefix.
                    minLength: 1
                    type: string
                  sourcePostgres:
                    description: SourcePostgres records the original database name
                      the backup was taken from.
                    type: string
                required:
                - backupID
                - backupName
                - backupUID
                - bucketName
                - prefix
                - serverName
                type: object
              pointInTime:
                description: PointInTime initializes the target Postgres from a live
                  database's WAL archive.
                properties:
                  bucketName:
                    description: BucketName identifies the source Barman ObjectStore
                      and bucket.
                    minLength: 1
                    type: string
                  serverName:
                    description: ServerName identifies the source archive within the
                      ObjectStore.
                    minLength: 1
                    type: string
                  sourcePostgres:
                    description: SourcePostgres is the namespace-local source Postgres
                      name.
                    minLength: 1
                    type: string
                  sourceUID:
                    description: |-
                      SourceUID pins the UID of the source Postgres so a deleted and recreated
                      database with the same name cannot become the recovery source.
                    minLength: 1
                    type: string
                  targetTime:
                    description: |-
                      TargetTime is the explicit point in time to recover to, with whole-second
                      precision. Fractional seconds are rejected rather than silently truncated.
                    format: date-time
                    pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}([.]0+)?(Z|[+-][0-9]{2}:[0-9]{2})$
                    type: string
                required:
                - bucketName
                - serverName
                - sourcePostgres
                - sourceUID
                - targetTime
                type: object
              postgres:
                description: |-
                  Postgres is the namespace-local target Postgres resource name. It must
                  match metadata.name of this PostgresRecovery.
                maxLength: 253
                minLength: 1
                type: string
            required:
            - postgres
            type: object
            x-kubernetes-validations:
            - message: postgresrecovery spec is immutable
              rule: self == oldSelf
            - message: exactly one of pointInTime or backup must be set
              rule: '(has(self.pointInTime) ? 1 : 0) + (has(self.backup) ? 1 : 0)
                == 1'
          status:
            description: PostgresRecoveryStatus defines the observed state of PostgresRecovery.
            properties:
              conditions:
                description: |-
                  conditions represent the current state of the controlled resource.
                  Each condition has a unique type and reflects the status of a specific aspect of the resource.

                  Standard condition types include:
                  - "Available": the resource is fully functional
                  - "Progressing": the resource is being created or updated
                  - "Degraded": the resource failed to reach or maintain its desired state

                  The status of each condition is one of True, False, or Unknown.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              correlationID:
                type: string
              observedGeneration:
                format: int64
                type: integer
              reconcilePhase:
                type: string
              reconcileTime:
                format: date-time
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
