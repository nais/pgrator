apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: postgres-basic
spec:
  description: >-
    A Postgres resource produces the CNPG Cluster, durable owner and personal-access
    DatabaseRoles, the pooler and the NetworkPolicy, and the API server fills in the spec defaults.
  steps:
    - name: Create Postgres with only the required field
      try:
        - apply:
            resource:
              apiVersion: nais.io/v1
              kind: Postgres
              metadata:
                name: mydb
              spec:
                majorVersion: "18"

    - name: CRD defaults are applied
      try:
        - assert:
            resource:
              apiVersion: nais.io/v1
              kind: Postgres
              metadata:
                name: mydb
              spec:
                resources:
                  diskSize: 10Gi
                  cpu: 100m
                  memory: 512Mi

    - name: Cluster restricts personal passwords and requires certificates otherwise
      try:
        - assert:
            resource:
              apiVersion: postgresql.cnpg.io/v1
              kind: Cluster
              metadata:
                name: pg-mydb
              spec:
                instances: 2
                enableSuperuserAccess: false
                bootstrap:
                  initdb:
                    database: app
                    owner: app
                postgresql:
                  pg_hba:
                    # The pooler authenticates as itself and is mapped to the
                    # requested role via pg_ident. Only the physical instance's
                    # personal-access group may use SCRAM; other clients must
                    # present their own certificate, and plaintext is rejected.
                    - hostssl all all ${podselector:pooler} cert map=pooler
                    - hostssl all +nais_pa_b50d3038fdd554ed all scram-sha-256
                    - hostssl all all all cert
                    - hostnossl all all all reject
                  pg_ident:
                    - pooler cnpg_pooler_pgbouncer all

    - name: Pooler and NetworkPolicy are created
      try:
        - assert:
            resource:
              apiVersion: postgresql.cnpg.io/v1
              kind: Pooler
              metadata:
                name: pg-mydb-pooler
        - script:
            content: |
              set -eu
              kubectl get networkpolicy \
                -n "$NAMESPACE" \
                -l postgres.nais.io/name=mydb \
                -o name | grep -q '^networkpolicy.networking.k8s.io/'

    - name: No Google resources without a WAL bucket configured
      try:
        - error:
            resource:
              apiVersion: iam.cnrm.cloud.google.com/v1beta1
              kind: IAMServiceAccount
              metadata:
                name: cnpg-mydb
