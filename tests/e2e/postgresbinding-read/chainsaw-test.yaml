apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: postgresbinding-read
spec:
  description: >-
    Read and readwrite bindings for one workload get distinct login roles,
    connection and client-certificate Secrets, and NetworkPolicies to the
    pooler. The workload reads the rotating CA certificate directly from the
    CNPG Secret.
  steps:
    - name: Create Postgres
      try:
        - apply:
            resource:
              apiVersion: nais.io/v1
              kind: Postgres
              metadata:
                name: mydb
              spec:
                majorVersion: "18"
        - assert:
            resource:
              apiVersion: postgresql.cnpg.io/v1
              kind: Cluster
              metadata:
                name: pg-mydb-main-6bc4781b

    - name: Create a read binding
      try:
        - apply:
            resource:
              apiVersion: nais.io/v1
              kind: PostgresBinding
              metadata:
                name: postgres-mydb-rapport-read
              spec:
                postgres: mydb
                consumer:
                  workload:
                    name: rapport
                    type: job
                credentials:
                  - read

    - name: Role is a login role that only inherits app_read
      try:
        - assert:
            resource:
              apiVersion: postgresql.cnpg.io/v1
              kind: DatabaseRole
              metadata:
                name: postgres-mydb-rapport-read-mydb-main-6bc4781b-read
              spec:
                name: rapport-read
                login: true
                inRoles:
                  - app_read
                # Withdrawal revokes access without replacing the SQL identity.
                databaseRoleReclaimPolicy: retain
                clientCertificate:
                  enabled: true

    - name: Connection Secret points at the pooler with the binding's own identity
      try:
        - assert:
            resource:
              apiVersion: v1
              kind: Secret
              metadata:
                name: postgres-mydb-rapport-read
        - script:
            content: |
              set -eu
              get() { kubectl get secret postgres-mydb-rapport-read -n "$NAMESPACE" -o "jsonpath={.data.$1}" | base64 -d; }
              test "$(get READ_PGUSER)"     = "rapport-read"
              test "$(get READ_PGHOST)"     = "pg-mydb-main-6bc4781b-pooler.$NAMESPACE"
              test "$(get READ_PGDATABASE)" = "app"
              test "$(get READ_PGSSLMODE)"  = "verify-full"

    - name: CloudNativePG owns the CA Secret mounted by the workload
      try:
        - script:
            content: |
              set -eu
              test -n "$(kubectl get secret pg-mydb-main-6bc4781b-ca -n "$NAMESPACE" -o jsonpath='{.data.ca\.crt}')"

    - name: CloudNativePG issues the client certificate for the role
      try:
        - assert:
            resource:
              apiVersion: v1
              kind: Secret
              metadata:
                name: postgres-mydb-rapport-read-mydb-main-6bc4781b-read-client-cert
              type: kubernetes.io/tls

    - name: Create a readwrite binding for the same workload
      try:
        - apply:
            resource:
              apiVersion: nais.io/v1
              kind: PostgresBinding
              metadata:
                name: postgres-mydb-rapport-readwrite
              spec:
                postgres: mydb
                consumer:
                  workload:
                    name: rapport
                    type: job
                credentials:
                  - readwrite
        - assert:
            resource:
              apiVersion: postgresql.cnpg.io/v1
              kind: DatabaseRole
              metadata:
                name: postgres-mydb-rapport-readwrite-mydb-main-6bc4781b-readwrite
              spec:
                name: rapport-readwrite
                login: true
                inRoles:
                  - app_readwrite
        - assert:
            resource:
              apiVersion: v1
              kind: Secret
              metadata:
                name: postgres-mydb-rapport-readwrite-mydb-main-6bc4781b-readwrite-client-cert
              type: kubernetes.io/tls
        - assert:
            resource:
              apiVersion: v1
              kind: Secret
              metadata:
                name: postgres-mydb-rapport-readwrite
        - script:
            content: |
              set -eu
              get() { kubectl get secret postgres-mydb-rapport-readwrite -n "$NAMESPACE" -o "jsonpath={.data.$1}" | base64 -d; }
              test "$(get READWRITE_PGUSER)" = "rapport-readwrite"

    - name: NetworkPolicy opens the workload's path to the pooler
      try:
        - assert:
            resource:
              apiVersion: networking.k8s.io/v1
              kind: NetworkPolicy
              metadata:
                name: postgres-mydb-rapport-read
              spec:
                podSelector:
                  matchLabels:
                    cnpg.io/poolerName: pg-mydb-main-6bc4781b-pooler
        - assert:
            resource:
              apiVersion: networking.k8s.io/v1
              kind: NetworkPolicy
              metadata:
                name: postgres-mydb-rapport-read-egress
              spec:
                podSelector:
                  matchLabels:
                    app: rapport

    - name: Unbind and rebind preserves SQL identity and a long-lived session
      try:
        - script:
            timeout: 3m
            env:
              - name: NAMESPACE
                value: ($namespace)
            content: |
              python3 - <<'PY'
              import json, os, subprocess, time
              ns = os.environ['NAMESPACE']
              binding = 'postgres-mydb-rapport-read'
              role = binding + '-mydb-main-6bc4781b-read'
              cluster = 'pg-mydb-main-6bc4781b'
              def kubectl(*args, input=None):
                  return subprocess.run(['kubectl', '-n', ns, *args], input=input, text=True, capture_output=True, check=True).stdout.strip()
              primary = None
              deadline = time.monotonic() + 90
              while time.monotonic() < deadline:
                  primary = json.loads(kubectl('get', 'clusters.postgresql.cnpg.io', cluster, '-o', 'json')).get('status', {}).get('currentPrimary')
                  if primary:
                      state = json.loads(kubectl('get', 'pod', primary, '-o', 'json'))
                      if any(c['type'] == 'Ready' and c['status'] == 'True' for c in state.get('status', {}).get('conditions', [])):
                          break
                  time.sleep(0.5)
              else:
                  raise AssertionError('PostgreSQL primary was not ready')
              psql = ['exec', primary, '-c', 'postgres', '--', 'psql', '-XAt', '-U', 'postgres', '-d', 'app', '-v', 'ON_ERROR_STOP=1']
              def sql(statement):
                  return kubectl(*psql, '-c', statement)
              def ready():
                  deadline = time.monotonic() + 60
                  while time.monotonic() < deadline:
                      try:
                          r = json.loads(kubectl('get', 'databaseroles.postgresql.cnpg.io', role, '-o', 'json'))
                      except subprocess.CalledProcessError as e:
                          if 'NotFound' not in e.stderr:
                              raise
                          time.sleep(0.5)
                          continue
                      if r['spec'].get('login') and r.get('status', {}).get('applied') and r['status'].get('observedGeneration') == r['metadata']['generation']:
                          return
                      time.sleep(0.5)
                  raise AssertionError('role was not applied')
              manifest = json.loads(kubectl('get', 'postgresbindings.nais.io', binding, '-o', 'json'))
              manifest = {'apiVersion': manifest['apiVersion'], 'kind': manifest['kind'], 'metadata': {'name': binding, 'namespace': ns}, 'spec': manifest['spec']}
              ready()
              sql('SET ROLE app; CREATE TABLE public.binding_rebind_probe(id integer)')
              oid = sql("SELECT oid FROM pg_roles WHERE rolname='rapport-read'")
              cmd = ['kubectl', '-n', ns, 'exec', '-i', primary, '-c', 'postgres', '--', 'psql', '-XAt', '-U', 'postgres', '-d', 'app', '-v', 'VERBOSITY=verbose']
              session = subprocess.Popen(cmd, stdin=subprocess.PIPE, stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True, bufsize=1)
              def query(statement):
                  session.stdin.write(statement + ';\n\\echo REBIND_DONE\n')
                  session.stdin.flush()
                  lines = []
                  for line in session.stdout:
                      if line.strip() == 'REBIND_DONE':
                          return '\n'.join(lines)
                      lines.append(line.rstrip())
                  raise AssertionError('persistent database session was terminated')
              try:
                  assert query('SET SESSION AUTHORIZATION "rapport-read"') == 'SET'
                  assert query('SELECT count(*) FROM public.binding_rebind_probe') == '0'
                  for cycle in range(2):
                      kubectl('delete', 'postgresbindings.nais.io', binding, '--timeout=60s')
                      assert sql("SELECT oid FROM pg_roles WHERE rolname='rapport-read'") == oid, 'SQL identity dropped on unbind'
                      assert sql("SELECT rolcanlogin::text || '/' || (SELECT count(*) FROM pg_auth_members WHERE member=r.oid) FROM pg_roles r WHERE rolname='rapport-read'") == 'false/0', 'access not revoked'
                      # Use a successful boolean query on the persistent exec
                      # stream; separate remote stderr can arrive after stdout.
                      assert query("SELECT has_table_privilege(current_user,'public.binding_rebind_probe','SELECT')") == 'f', 'existing session still has access after revocation'
                      denied = subprocess.run(['kubectl', '-n', ns, *psql, '-v', 'VERBOSITY=verbose', '-c', 'SET ROLE "rapport-read"; SELECT count(*) FROM public.binding_rebind_probe'], text=True, capture_output=True)
                      assert denied.returncode != 0 and '42501' in denied.stderr, 'revoked SQL access did not fail with insufficient_privilege'
                      kubectl('apply', '-f', '-', input=json.dumps(manifest))
                      ready()
                      assert sql("SELECT oid FROM pg_roles WHERE rolname='rapport-read'") == oid, 'SQL identity changed on rebind'
                      assert query('SELECT count(*) FROM public.binding_rebind_probe') == '0', 'old session lost access after rebind'
                      print('rebind cycle', cycle + 1, 'passed with unchanged SQL OID', oid)
              finally:
                  session.stdin.write('\\q\n')
                  session.stdin.flush()
                  session.wait(timeout=10)
              PY

    - name: Deleting the binding withdraws the access
      try:
        - delete:
            ref:
              apiVersion: nais.io/v1
              kind: PostgresBinding
              name: postgres-mydb-rapport-read
        - error:
            resource:
              apiVersion: postgresql.cnpg.io/v1
              kind: DatabaseRole
              metadata:
                name: postgres-mydb-rapport-read-mydb-main-6bc4781b-read
        - error:
            resource:
              apiVersion: v1
              kind: Secret
              metadata:
                name: postgres-mydb-rapport-read
        - error:
            resource:
              apiVersion: networking.k8s.io/v1
              kind: NetworkPolicy
              metadata:
                name: postgres-mydb-rapport-read
        - error:
            resource:
              apiVersion: networking.k8s.io/v1
              kind: NetworkPolicy
              metadata:
                name: postgres-mydb-rapport-read-egress
        - assert:
            resource:
              apiVersion: postgresql.cnpg.io/v1
              kind: DatabaseRole
              metadata:
                name: postgres-mydb-rapport-readwrite-mydb-main-6bc4781b-readwrite
              spec:
                name: rapport-readwrite

    - name: The database survives
      try:
        - assert:
            resource:
              apiVersion: postgresql.cnpg.io/v1
              kind: Cluster
              metadata:
                name: pg-mydb-main-6bc4781b
