apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: postgresbinding-read
spec:
  description: >-
    A read binding gets its own login role limited to app_read, connection and
    client-certificate Secrets, and NetworkPolicies to the pooler. The workload
    reads the rotating CA certificate directly from the CNPG Secret.
  steps:
    - name: Create Postgres
      try:
        - apply:
            resource:
              apiVersion: nais.io/v1
              kind: Postgres
              metadata:
                name: mydb
              spec:
                majorVersion: "18"
        - assert:
            resource:
              apiVersion: postgresql.cnpg.io/v1
              kind: Cluster
              metadata:
                name: mydb

    - name: Create a read binding
      try:
        - apply:
            resource:
              apiVersion: nais.io/v1
              kind: PostgresBinding
              metadata:
                name: postgres-mydb-rapport-read
              spec:
                postgres: mydb
                workload:
                  name: rapport
                  type: job
                secretName: mydb-rapport-read-client-cert
                role: read

    - name: Role is a login role that only inherits app_read
      try:
        - assert:
            resource:
              apiVersion: postgresql.cnpg.io/v1
              kind: DatabaseRole
              metadata:
                name: mydb-rapport-read
              spec:
                name: rapport
                login: true
                inRoles:
                  - app_read
                # The binding is the grant, so withdrawing it drops the role.
                databaseRoleReclaimPolicy: delete
                clientCertificate:
                  enabled: true

    - name: Connection Secret points at the pooler with the binding's own identity
      try:
        - script:
            content: |
              set -eu
               get() { kubectl get secret rapport-mydb -n "$NAMESPACE" -o "jsonpath={.data.$1}" | base64 -d; }
              test "$(get PGUSER)"     = "rapport"
              test "$(get PGHOST)"     = "mydb-pooler.$NAMESPACE"
              test "$(get PGDATABASE)" = "app"
              test "$(get PGSSLMODE)"  = "verify-full"
              test "$(get PGSSLCERT)"  = "/var/run/secrets/nais.io/postgres/client/tls.crt"
              test "$(get PGSSLROOTCERT)" = "/var/run/secrets/nais.io/postgres/ca/ca.crt"

    - name: CloudNativePG owns the CA Secret mounted by the workload
      try:
        - script:
            content: |
              set -eu
              test -n "$(kubectl get secret mydb-ca -n "$NAMESPACE" -o jsonpath='{.data.ca\.crt}')"

    - name: CloudNativePG issues the client certificate for the role
      try:
        - assert:
            resource:
              apiVersion: v1
              kind: Secret
              metadata:
                name: mydb-rapport-read-client-cert
              type: kubernetes.io/tls

    - name: NetworkPolicy opens the workload's path to the pooler
      try:
        - assert:
            resource:
              apiVersion: networking.k8s.io/v1
              kind: NetworkPolicy
              metadata:
                name: rapport-mydb
              spec:
                podSelector:
                  matchLabels:
                    cnpg.io/poolerName: mydb-pooler
        - assert:
            resource:
              apiVersion: networking.k8s.io/v1
              kind: NetworkPolicy
              metadata:
                name: rapport-mydb-egress
              spec:
                podSelector:
                  matchLabels:
                    app: rapport

    - name: Deleting the binding withdraws the access
      try:
        - delete:
            ref:
              apiVersion: nais.io/v1
              kind: PostgresBinding
              name: rapport-mydb
        - error:
            resource:
              apiVersion: postgresql.cnpg.io/v1
              kind: DatabaseRole
              metadata:
                name: mydb-rapport-read
        - error:
            resource:
              apiVersion: v1
              kind: Secret
              metadata:
                name: rapport-mydb
        - error:
            resource:
              apiVersion: networking.k8s.io/v1
              kind: NetworkPolicy
              metadata:
                name: rapport-mydb
        - error:
            resource:
              apiVersion: networking.k8s.io/v1
              kind: NetworkPolicy
              metadata:
                name: rapport-mydb-egress

    - name: The database survives
      try:
        - assert:
            resource:
              apiVersion: postgresql.cnpg.io/v1
              kind: Cluster
              metadata:
                name: mydb
