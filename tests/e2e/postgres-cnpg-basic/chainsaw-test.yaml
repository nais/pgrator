apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: postgres-cnpg-basic
spec:
  description: Verify that a Postgres resource with CNPG engine creates expected child resources
  steps:
    - name: Create prerequisites
      try:
        - apply:
            resource:
              apiVersion: v1
              kind: Namespace
              metadata:
                name: cnpg-team
                labels:
                  google-cloud-project: test-project
    - name: Create Postgres resource
      try:
        - apply:
            resource:
              apiVersion: data.nais.io/v1
              kind: Postgres
              metadata:
                name: mydb
                namespace: cnpg-team
                annotations:
                  postgres.nais.io/engine: cnpg
              spec:
                cluster:
                  majorVersion: "18"
                  allowDeletion: true
                  resources:
                    diskSize: 10Gi
                    memory: 1Gi
                    cpu: 1
    - name: Assert CNPG Cluster created
      try:
        - assert:
            resource:
              apiVersion: postgresql.cnpg.io/v1
              kind: Cluster
              metadata:
                name: mydb
                namespace: cnpg-team
    - name: Assert CNPG Pooler created
      try:
        - assert:
            resource:
              apiVersion: postgresql.cnpg.io/v1
              kind: Pooler
              metadata:
                name: mydb-pooler
                namespace: cnpg-team
    - name: Assert NetworkPolicy created
      try:
        - assert:
            resource:
              apiVersion: networking.k8s.io/v1
              kind: NetworkPolicy
              metadata:
                name: mydb
                namespace: cnpg-team
    - name: Assert engine annotation set
      try:
        - assert:
            resource:
              apiVersion: data.nais.io/v1
              kind: Postgres
              metadata:
                name: mydb
                namespace: cnpg-team
              status:
                engine: cnpg
    - name: Assert IAMServiceAccount created
      try:
        - assert:
            resource:
              apiVersion: iam.cnrm.cloud.google.com/v1beta1
              kind: IAMServiceAccount
              metadata:
                name: cnpg-mydb-b60fcdec
                namespace: cnpg-team
    - name: Assert IAMPolicyMember workload identity created
      try:
        - assert:
            resource:
              apiVersion: iam.cnrm.cloud.google.com/v1beta1
              kind: IAMPolicyMember
              metadata:
                name: cnpg-wi-user-mydb-243afc71
                namespace: cnpg-team
              spec:
                role: roles/iam.workloadIdentityUser
