apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: postgresbinding-admin
spec:
  description: >-
    Multiple admin bindings consume the branch-owned durable owner certificate
    and publish independent connection Secrets.
  steps:
    - name: Create Postgres
      try:
        - apply:
            resource:
              apiVersion: nais.io/v1
              kind: Postgres
              metadata:
                name: mydb
              spec:
                majorVersion: "18"
        - assert:
            resource:
              apiVersion: postgresql.cnpg.io/v1
              kind: Cluster
              metadata:
                name: pg-mydb-main-6bc4781b

    - name: Create an admin binding
      try:
        - apply:
            resource:
              apiVersion: nais.io/v1
              kind: PostgresBinding
              metadata:
                name: eier-mydb
              spec:
                postgres: mydb
                consumer:
                  workload:
                    name: eier
                    type: application
                credentials:
                  - admin

    - name: The binding uses the instance-owned durable owner role
      try:
        - assert:
            resource:
              apiVersion: postgresql.cnpg.io/v1
              kind: DatabaseRole
              metadata:
                name: pg-mydb-main-6bc4781b-app
              spec:
                name: app
                login: true
                databaseRoleReclaimPolicy: delete

    - name: The binding points at the durable owner
      try:
        - assert:
            resource:
              apiVersion: v1
              kind: Secret
              metadata:
                name: eier-mydb
        - script:
            content: |
              set -eu
              user=$(kubectl get secret eier-mydb -n "$NAMESPACE" \
                       -o jsonpath='{.data.PGUSER}' | base64 -d)
              test "$user" = "app"

    - name: Another workload can pin the same branch with admin credentials
      try:
        - apply:
            resource:
              apiVersion: nais.io/v1
              kind: PostgresBinding
              metadata:
                name: other-mydb
              spec:
                postgres: mydb
                branch: main
                consumer:
                  workload:
                    name: other
                    type: application
                credentials:
                  - admin
        - assert:
            resource:
              apiVersion: v1
              kind: Secret
              metadata:
                name: other-mydb
        - script:
            content: |
              set -eu
              user=$(kubectl get secret other-mydb -n "$NAMESPACE" \
                       -o jsonpath='{.data.PGUSER}' | base64 -d)
              test "$user" = "app"

    - name: Deleting one binding retains the shared owner and the other binding
      try:
        - delete:
            ref:
              apiVersion: nais.io/v1
              kind: PostgresBinding
              name: eier-mydb
        - error:
            resource:
              apiVersion: v1
              kind: Secret
              metadata:
                name: eier-mydb
        - assert:
            resource:
              apiVersion: postgresql.cnpg.io/v1
              kind: DatabaseRole
              metadata:
                name: pg-mydb-main-6bc4781b-app
        - assert:
            resource:
              apiVersion: v1
              kind: Secret
              metadata:
                name: pg-mydb-main-6bc4781b-app-client-cert
        - assert:
            resource:
              apiVersion: v1
              kind: Secret
              metadata:
                name: other-mydb
