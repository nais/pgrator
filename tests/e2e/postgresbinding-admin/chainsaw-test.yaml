apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: postgresbinding-admin
spec:
  description: >-
    An admin binding reuses the durable owner role rather than creating one of its
    own, so that database objects keep a stable owner across deploys and no single
    binding can drop the owner.
  steps:
    - name: Create Postgres
      try:
        - apply:
            resource:
              apiVersion: nais.io/v1
              kind: Postgres
              metadata:
                name: mydb
              spec:
                majorVersion: "18"
        - assert:
            resource:
              apiVersion: postgresql.cnpg.io/v1
              kind: Cluster
              metadata:
                name: mydb

    - name: Create a binding without stating a role
      try:
        - apply:
            resource:
              apiVersion: nais.io/v1
              kind: PostgresBinding
              metadata:
                name: eier-mydb
              spec:
                postgres: mydb
                workload:
                  name: eier
                  type: application

    - name: Role defaults to admin
      try:
        - assert:
            resource:
              apiVersion: nais.io/v1
              kind: PostgresBinding
              metadata:
                name: eier-mydb
              spec:
                role: admin

    - name: No DatabaseRole is created for the binding
      try:
        - error:
            resource:
              apiVersion: postgresql.cnpg.io/v1
              kind: DatabaseRole
              metadata:
                name: mydb-eier

    - name: The binding points at the durable owner instead
      try:
        - script:
            content: |
              set -eu
              user=$(kubectl get secret postgres-mydb-eier -n "$NAMESPACE" \
                       -o jsonpath='{.data.PGUSER}' | base64 -d)
              test "$user" = "app"

    - name: Deleting the binding leaves the owner role intact
      try:
        - delete:
            ref:
              apiVersion: nais.io/v1
              kind: PostgresBinding
              name: eier-mydb
        - error:
            resource:
              apiVersion: v1
              kind: Secret
              metadata:
                name: postgres-mydb-eier
        - assert:
            resource:
              apiVersion: postgresql.cnpg.io/v1
              kind: DatabaseRole
              metadata:
                name: mydb-app
