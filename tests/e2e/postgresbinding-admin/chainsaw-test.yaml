apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: postgresbinding-admin
spec:
  description: >-
    An admin binding adopts the durable owner role and receives its own
    CloudNativePG-managed client certificate.
  steps:
    - name: Create Postgres
      try:
        - apply:
            resource:
              apiVersion: nais.io/v1
              kind: Postgres
              metadata:
                name: mydb
              spec:
                majorVersion: "18"
        - assert:
            resource:
              apiVersion: postgresql.cnpg.io/v1
              kind: Cluster
              metadata:
                name: pg-mydb

    - name: Create an admin binding
      try:
        - apply:
            resource:
              apiVersion: nais.io/v1
              kind: PostgresBinding
              metadata:
                name: eier-mydb
              spec:
                postgres: mydb
                consumer:
                  workload:
                    name: eier
                    type: application
                credentials:
                  - admin

    - name: The binding uses the instance-owned durable owner role
      try:
        - assert:
            resource:
              apiVersion: postgresql.cnpg.io/v1
              kind: DatabaseRole
              metadata:
                name: pg-mydb-app
              spec:
                name: app
                login: true
                databaseRoleReclaimPolicy: delete

    - name: The binding points at the durable owner
      try:
        - script:
            content: |
              set -eu
              user=$(kubectl get secret eier-mydb -n "$NAMESPACE" \
                       -o jsonpath='{.data.PGUSER}' | base64 -d)
              test "$user" = "app"

    - name: Deleting the binding removes its credential and retains the instance-owned role
      try:
        - delete:
            ref:
              apiVersion: nais.io/v1
              kind: PostgresBinding
              name: eier-mydb
        - error:
            resource:
              apiVersion: v1
              kind: Secret
              metadata:
                name: eier-mydb
        - assert:
            resource:
              apiVersion: postgresql.cnpg.io/v1
              kind: DatabaseRole
              metadata:
                name: pg-mydb-app
        - assert:
            resource:
              apiVersion: v1
              kind: Secret
              metadata:
                name: pg-mydb-app-client-cert
