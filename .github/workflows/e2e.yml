name: E2E Tests

on:
  pull_request:
    paths-ignore:
      - '*.md'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  e2e:
    name: Chainsaw E2E
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # ratchet:actions/checkout@v7.0.0

      - uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d # ratchet:jdx/mise-action@v4.2.0

      - name: Run CI tests
        run: mise run test:ci

      - name: Publish Test Results
        uses: EnricoMi/publish-unit-test-result-action@d0a4676d0e0b938bc201470d88276b7c74c712b3 # ratchet:EnricoMi/publish-unit-test-result-action@v2
        if: always()
        with:
          files: chainsaw-report.xml

      - name: Collect debug info on failure
        if: failure()
        run: |
          echo "=== Operator logs ==="
          kubectl logs -n pgrator-system deployment/pgrator --tail=100 || true
          echo "=== All pods ==="
          kubectl get pods -A || true
          echo "=== Events ==="
          kubectl get events -A --sort-by='.lastTimestamp' | tail -50 || true
