name: E2E Tests

on:
  pull_request:
    paths-ignore:
      - '*.md'
      - 'grafana/**'
      - '.github/workflows/dashboards.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  e2e:
    name: Chainsaw E2E
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7

      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # ratchet:jdx/mise-action@v5.2.7

      - name: Run CI tests
        run: mise run test:ci

      - name: Publish Test Results
        uses: EnricoMi/publish-unit-test-result-action@da5b7be67623cd59bbbd1a0ce4f022050a55605f # ratchet:EnricoMi/publish-unit-test-result-action@v2
        if: always()
        with:
          files: chainsaw-report.xml

      - name: Collect debug info on failure
        if: failure()
        run: |
          echo "=== Operator logs ==="
          kubectl logs -n pgrator-system deployment/pgrator --tail=100 || true
          echo "=== All pods ==="
          kubectl get pods -A || true
          echo "=== Events ==="
          kubectl get events -A --sort-by='.lastTimestamp' | tail -50 || true
