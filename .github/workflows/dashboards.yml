name: Dashboard checks

on:
  pull_request:
    paths:
      - 'grafana/**'
      - '.github/workflows/dashboards.yml'
  push:
    paths:
      - 'grafana/**'
      - '.github/workflows/dashboards.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Check dashboards
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7
      - uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # ratchet:jdx/mise-action@v5.2.5
        with:
          install: false
          cache: false
      - name: Install dashboard dependencies
        run: make -C grafana install
      - name: Check formatting and generated resources
        run: make -C grafana check
