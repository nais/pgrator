name: Dashboard checks

on:
  pull_request:
    paths:
      - 'grafana/**'
      - '.github/workflows/dashboards.yml'
  push:
    paths:
      - 'grafana/**'
      - '.github/workflows/dashboards.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Check dashboards
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7
      - name: Validate dashboard resources
        run: |
          set -euo pipefail
          for f in grafana/*.json; do
            jq -e '.apiVersion == "dashboard.grafana.app/v1" and .kind == "Dashboard"
              and (.metadata.name | type == "string") and .metadata.name == .spec.uid' "$f" > /dev/null \
              || { echo "::error file=$f::not a dashboard.grafana.app/v1 Dashboard whose metadata.name equals spec.uid"; exit 1; }
          done
