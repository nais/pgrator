name: Dashboard checks

on:
  pull_request:
    paths:
      - 'dashboards/**'
      - '.github/workflows/dashboards.yml'
  push:
    paths:
      - 'dashboards/**'
      - '.github/workflows/dashboards.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Check dashboards
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7
      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # ratchet:jdx/mise-action@v5.2.3
        with:
          install: false
          cache: false
      - name: Install dashboard dependencies
        run: make -C dashboards install
      - name: Check formatting and generated resources
        run: make -C dashboards check
