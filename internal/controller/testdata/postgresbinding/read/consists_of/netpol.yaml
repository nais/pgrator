---
action: createOrUpdate
matcher: Subset
object:
  apiVersion: networking.k8s.io/v1
  kind: NetworkPolicy
  metadata:
    name: reporter-mydb
    namespace: myteam
  spec:
    podSelector:
      matchLabels:
        cnpg.io/poolerName: mydb-pooler
    ingress:
      - from:
          - podSelector:
              matchLabels:
                app: reporter
