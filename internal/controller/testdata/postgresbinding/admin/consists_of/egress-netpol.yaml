---
action: createOrUpdate
matcher: Subset
object:
  apiVersion: networking.k8s.io/v1
  kind: NetworkPolicy
  metadata:
    name: mydb-myapp-admin-egress
    namespace: myteam
  spec:
    podSelector:
      matchLabels:
        app: myapp
    policyTypes:
      - Egress
    egress:
      - to:
          - podSelector:
              matchLabels:
                cnpg.io/poolerName: mydb-pooler
        ports:
          - port: 5432
      - to:
          - namespaceSelector: {}
            podSelector:
              matchLabels:
                k8s-app: kube-dns
