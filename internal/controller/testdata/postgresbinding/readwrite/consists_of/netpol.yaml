---
action: createOrUpdate
matcher: Subset
object:
  apiVersion: networking.k8s.io/v1
  kind: NetworkPolicy
  metadata:
    name: postgres-mydb-myapp-readwrite
    namespace: myteam
  spec:
    podSelector:
      matchLabels:
        cnpg.io/poolerName: mydb-pooler
    policyTypes:
      - Ingress
    ingress:
      - from:
          - podSelector:
              matchLabels:
                app: myapp
        ports:
          - port: 5432
