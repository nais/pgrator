  kind: Secret
  metadata:
    name: myapp-mydb
    namespace: myteam
  stringData:
    READWRITE_PGHOST: pg-mydb-pooler.myteam
    READWRITE_PGPORT: "5432"
    READWRITE_PGDATABASE: app
    READWRITE_PGUSER: myapp-readwrite
    READWRITE_PGSSLMODE: verify-full
