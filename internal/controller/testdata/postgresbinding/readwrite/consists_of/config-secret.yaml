---
action: createOrUpdate
matcher: Subset
object:
  apiVersion: v1
  kind: Secret
  metadata:
    name: myapp-mydb
    namespace: myteam
  stringData:
    PGHOST: mydb-pooler.myteam
    PGPORT: "5432"
    PGDATABASE: app
    PGUSER: myapp
    PGSSLMODE: verify-full
    PGSSLCERT: /var/run/secrets/nais.io/postgres/client/tls.crt
    PGSSLKEY: /var/run/secrets/nais.io/postgres/client/tls.key
    PGSSLROOTCERT: /var/run/secrets/nais.io/postgres/ca/ca.crt
