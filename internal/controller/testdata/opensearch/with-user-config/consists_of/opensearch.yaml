---
action: createOrUpdate
matcher: Equal
object:
  apiVersion: aiven.io/v1alpha1
  kind: OpenSearch
  metadata:
    labels:
      team: config-team
      opensearch.nais.io/name: configured-opensearch
    name: opensearch-config-team-configured-opensearch
    namespace: config-team
    ownerReferences:
      - apiVersion: nais.io/v1
        kind: OpenSearch
        name: configured-opensearch
        uid: ""
        controller: true
        blockOwnerDeletion: true
  spec:
    project: test-project
    plan: startup-4
    projectVpcId: test-vpc-id
    disk_space: 80GiB
    terminationProtection: true
    tags:
      team: config-team
      app: configured-opensearch
      tenant: test-tenant
    userConfig:
      opensearch_version: "2"
      opensearch:
        shard_indexing_pressure:
          enabled: true
          enforced: true
        indices_query_bool_max_clause_count: 2048
        http_max_content_length: 209715200
