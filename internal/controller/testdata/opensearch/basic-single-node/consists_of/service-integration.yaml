  kind: ServiceIntegration
  metadata:
    labels:
      team: my-team
      opensearch.nais.io/name: my-opensearch
    name: opensearch-my-team-my-opensearch
    namespace: my-team
    ownerReferences:
      - apiVersion: nais.io/v1
        kind: OpenSearch
        name: my-opensearch
        uid: ""
        controller: true
        blockOwnerDeletion: true
  spec:
