apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: relayaccesses.nais.io
spec:
  group: nais.io
  scope: Namespaced
  names:
    plural: relayaccesses
    singular: relayaccess
    kind: RelayAccess
    shortNames: []
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              required: [target, expiresAt, tokenSHA256]
              x-kubernetes-validations:
                - rule: self == oldSelf
                  message: spec is immutable
              properties:
                target:
                  type: object
                  required: [serviceName, port]
                  properties:
                    serviceName:
                      type: string
                      maxLength: 63
                      pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$'
                    port:
                      type: integer
                      minimum: 1
                      maximum: 65535
                expiresAt:
                  type: string
                  format: date-time
                tokenSHA256:
                  type: string
                  pattern: '^[0-9a-f]{64}$'
                  minLength: 64
                  maxLength: 64
