---
action: createOrUpdate
matcher: Subset
object:
  apiVersion: networking.k8s.io/v1
  kind: NetworkPolicy
  metadata:
    name: frode-orders-access-tunnel
    namespace: myteam
  spec:
    podSelector:
      matchLabels:
        cnpg.io/cluster: pg-orders-restore
        cnpg.io/instanceRole: primary
    policyTypes:
      - Ingress
    ingress:
      - from:
          - podSelector:
              matchLabels:
                tunnels.nais.io/tunnel: frode-orders-access
                app.kubernetes.io/managed-by: tunnel-operator
                app.kubernetes.io/component: tunnel-gateway
        ports:
          - protocol: TCP
            port: 5432
