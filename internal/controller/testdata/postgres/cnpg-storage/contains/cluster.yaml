---
action: create
matcher: Subset
object:
  apiVersion: postgresql.cnpg.io/v1
  kind: Cluster
  metadata:
    labels:
      postgres.data.nais.io/name: test-db
      apiserver-access: enabled
    name: test-db
    namespace: my-team
  spec:
    instances: 2
    imageCatalogRef:
      apiGroup: postgresql.cnpg.io
      kind: ClusterImageCatalog
      name: postgresql
      major: 18
    storage:
      size: 10Gi
      storageClass: hyperdisk-balanced
    plugins:
      - name: barman-cloud.cloudnative-pg.io
        isWALArchiver: true
        parameters:
          barmanObjectName: wal-bucket-prefix-feedab1e-beef-cafe-babe-700d1e100d1e
    serviceAccountTemplate:
      metadata:
        annotations:
          iam.gke.io/gcp-service-account: "cnpg-test-db-020a67ba@test-gcp-project.iam.gserviceaccount.com"
