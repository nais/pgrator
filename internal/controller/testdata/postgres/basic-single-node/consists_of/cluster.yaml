---
action: createOrUpdate
matcher: Subset
object:
  apiVersion: postgresql.cnpg.io/v1
  kind: Cluster
  metadata:
    name: mydb
    namespace: myteam
    labels:
      postgres.nais.io/name: mydb
    ownerReferences:
      - apiVersion: nais.io/v1
        kind: Postgres
        name: mydb
        uid: ""
        controller: true
        blockOwnerDeletion: true
  spec:
    instances: 2
    imageCatalogRef:
      apiGroup: postgresql.cnpg.io
      kind: ClusterImageCatalog
      name: postgresql
      major: 18
    enableSuperuserAccess: false
    storage:
      storageClass: hyperdisk-balanced
      size: 10Gi
    bootstrap:
      initdb:
        database: app
        owner: app
    postgresql:
      pg_hba:
        - hostssl all all ${podselector:pooler} cert map=pooler
        - hostssl all all all cert
        - hostnossl all all all reject
      pg_ident:
        - pooler cnpg_pooler_pgbouncer all
    podSelectorRefs:
      - name: pooler
        selector:
          matchLabels:
            cnpg.io/poolerName: mydb-pooler
