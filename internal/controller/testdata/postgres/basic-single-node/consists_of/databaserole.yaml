---
action: createOrUpdate
matcher: Subset
object:
  apiVersion: postgresql.cnpg.io/v1
  kind: DatabaseRole
  metadata:
    name: mydb-app
    namespace: myteam
    labels:
      postgres.nais.io/name: mydb
    ownerReferences:
      - apiVersion: nais.io/v1
        kind: Postgres
        name: mydb
        uid: ""
        controller: true
        blockOwnerDeletion: true
  spec:
    name: app
    login: true
    cluster:
      name: mydb
    databaseRoleReclaimPolicy: retain
    clientCertificate: {}
