---
action: createOrUpdate
matcher: Subset
object:
  apiVersion: networking.k8s.io/v1
  kind: NetworkPolicy
  metadata:
    labels:
      postgres.data.nais.io/name: test-db
    name: test-db
    namespace: my-team
  spec:
    podSelector:
      matchLabels:
        cnpg.io/cluster: test-db
    policyTypes:
      - Egress
      - Ingress
    egress:
      - to:
          - podSelector:
              matchLabels:
                cnpg.io/cluster: test-db
    ingress:
      - from:
          - podSelector:
              matchLabels:
                cnpg.io/cluster: test-db
          - namespaceSelector:
              matchLabels:
                kubernetes.io/metadata.name: nais-system
            podSelector:
              matchLabels:
                app.kubernetes.io/name: cloudnative-pg
      - from:
          - namespaceSelector:
              matchLabels:
                kubernetes.io/metadata.name: nais-system
            podSelector:
              matchLabels:
                app.kubernetes.io/name: prometheus
          - namespaceSelector:
              matchLabels:
                kubernetes.io/metadata.name: nais-system
            podSelector:
              matchLabels:
                app.kubernetes.io/name: alloy
        ports:
          - port: metrics
