---
action: createOrUpdate
matcher: Subset
object:
  apiVersion: monitoring.coreos.com/v1
  kind: PrometheusRule
  metadata:
    labels:
      postgres.data.nais.io/name: test-db
    name: pg-test-db
    namespace: my-team
  spec:
    groups:
      - name: test-db-rules
        rules:
          - alert: PostgresReplicationLagHigh
            labels:
              severity: warning
          - alert: PostgresWALArchivingFailed
            labels:
              severity: warning
          - alert: PostgresBackupStale
            labels:
              severity: warning
          - alert: PostgresConnectionSaturation
            labels:
              severity: warning
          - alert: PostgresMemoryUsageHigh
            labels:
              severity: warning
          - alert: PostgresCpuUsageHigh
            labels:
              severity: warning
          - alert: PostgresDiskIsFull
            labels:
              severity: critical
          - alert: PostgresDiskUsageHigh
            labels:
              severity: warning
          - alert: ClusterIsDown
            labels:
              severity: critical
          - alert: MissingClusterInstance
            labels:
              severity: warning
