---
action: createOrUpdate
matcher: Equal
object:
  apiVersion: aiven.io/v1alpha1
  kind: Valkey
  metadata:
    labels:
      team: config-team
      valkey.nais.io/name: configured-valkey
    name: valkey-config-team-configured-valkey
    namespace: config-team
    ownerReferences:
      - apiVersion: nais.io/v1
        kind: Valkey
        name: configured-valkey
        uid: ""
        controller: true
        blockOwnerDeletion: true
  spec:
    project: test-project
    plan: startup-14
    projectVpcId: test-vpc-id
    terminationProtection: true
    tags:
      team: config-team
      app: configured-valkey
      tenant: test-tenant
    userConfig:
      valkey_maxmemory_policy: volatile-lru
      valkey_notify_keyspace_events: KEA
      valkey_persistence: "off"
