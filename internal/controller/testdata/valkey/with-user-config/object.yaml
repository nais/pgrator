---
apiVersion: nais.io/v1
kind: Valkey
metadata:
  name: configured-valkey
  namespace: config-team
  labels:
    team: config-team
spec:
  tier: SingleNode
  memory: 14GB
  version: "9.1"
  maxMemoryPolicy: volatile-lru
  notifyKeyspaceEvents: KEA
  persistence:
    disabled: true
  databases: 32
