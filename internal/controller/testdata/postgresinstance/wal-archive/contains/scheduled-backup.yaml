---
action: createOrUpdate
matcher: Subset
object:
  apiVersion: postgresql.cnpg.io/v1
  kind: ScheduledBackup
  metadata:
    name: pg-mydb
    namespace: myteam
  spec:
    schedule: "0 0 2 * * *"
    method: plugin
    target: prefer-standby
    backupOwnerReference: cluster
    cluster:
      name: pg-mydb
    pluginConfiguration:
      name: barman-cloud.cloudnative-pg.io
