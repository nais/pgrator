---
action: createOrUpdate
matcher: Subset
object:
  apiVersion: postgresql.cnpg.io/v1
  kind: Cluster
  metadata:
    name: pg-mydb
    namespace: myteam
    labels:
      postgres.nais.io/name: mydb
    ownerReferences:
      - apiVersion: nais.io/v1
        kind: PostgresInstance
        name: mydb
        uid: ""
        controller: true
        blockOwnerDeletion: true
  spec:
    inheritedMetadata:
      labels:
        logs.nais.io/flow-default: "false"
        logs.nais.io/flow-team_logs: "true"
    instances: 2
    imageCatalogRef:
      apiGroup: postgresql.cnpg.io
      kind: ClusterImageCatalog
      name: postgresql
      major: 18
    enableSuperuserAccess: false
    storage:
      storageClass: hyperdisk-balanced
      size: 10Gi
    bootstrap:
      initdb:
        database: app
        owner: app
    postgresql:
      pg_hba:
        - hostssl all all ${podselector:pooler} cert map=pooler
        - hostssl all all ${podselector:tunnel-gateway} scram-sha-256
        - hostssl all all all cert
        - hostnossl all all all reject
      pg_ident:
        - pooler cnpg_pooler_pgbouncer all
    podSelectorRefs:
      - name: pooler
        selector:
          matchLabels:
            cnpg.io/poolerName: pg-mydb-pooler
      - name: tunnel-gateway
        selector:
          matchLabels:
            app.kubernetes.io/managed-by: tunnel-operator
            app.kubernetes.io/component: tunnel-gateway
