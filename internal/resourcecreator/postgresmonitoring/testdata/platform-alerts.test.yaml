rule_files: [__RULE_FILE__]
evaluation_interval: 1m

tests:
  - name: Backups older than retention plus three days are not being removed
    interval: 1m
    input_series:
      - series: 'nais_postgres_backup_retention_days{namespace="team",postgres="orders"}'
        values: '7x15100'
      # Reported only from day 10, where the epoch is exactly retention plus three days old.
      - series: 'barman_cloud_cloudnative_pg_io_first_recoverability_point{namespace="team",postgres="orders",pod="p1"}'
        values: '_x14400 1x700'
    promql_expr_test:
      # The alert goes to the platform team (namespace nais-system); the
      # database's own namespace is kept as postgres_namespace.
      - expr: 'ALERTS{alertname="PostgresBackupRetentionNotEnforced",alertstate="firing"}'
        eval_time: 250h
        exp_samples:
          - labels: 'ALERTS{alertname="PostgresBackupRetentionNotEnforced",alertstate="firing",severity="warning",namespace="nais-system",postgres_namespace="team",postgres="orders"}'
            value: 1

  - name: The backup preceding the window is not an alert
    interval: 1m
    input_series:
      - series: 'nais_postgres_backup_retention_days{namespace="team",postgres="orders"}'
        values: '7x14500'
      # Positive timestamp, 9.5 days old at 240h: 7 days of retention plus the
      # backup preceding the window and a few missed nights. Without the three
      # day allowance this would fire.
      - series: 'barman_cloud_cloudnative_pg_io_first_recoverability_point{namespace="team",postgres="orders",pod="p1"}'
        values: '43200x14500'
    alert_rule_test:
      - eval_time: 240h
        alertname: PostgresBackupRetentionNotEnforced
        exp_alerts: []

  - name: A longer retention allows older backups
    interval: 1m
    input_series:
      - series: 'nais_postgres_backup_retention_days{namespace="team",postgres="archive"}'
        values: '30x14500'
      # 9.5 days old at 240h, far inside 30 + 3 days.
      - series: 'barman_cloud_cloudnative_pg_io_first_recoverability_point{namespace="team",postgres="archive",pod="p1"}'
        values: '43200x14500'
    alert_rule_test:
      - eval_time: 240h
        alertname: PostgresBackupRetentionNotEnforced
        exp_alerts: []

  - name: A missing recoverability point is not a retention problem
    interval: 1m
    input_series:
      - series: 'nais_postgres_backup_retention_days{namespace="team",postgres="orders"}'
        values: '7x200'
      - series: 'barman_cloud_cloudnative_pg_io_first_recoverability_point{namespace="team",postgres="orders",pod="p1"}'
        values: '0x200'
    alert_rule_test:
      - eval_time: 150m
        alertname: PostgresBackupRetentionNotEnforced
        exp_alerts: []
