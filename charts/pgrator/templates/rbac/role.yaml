{{- if .Values.rbac.enable }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    {{- include "chart.labels" . | nindent 4 }}
  name: pgrator-manager-role
rules:
# Primary resources - CRDs owned/reconciled by pgrator
# Auto-generates main resource + /finalizers and /status subresource rules
{{- range .Values.rbac.primaryResources }}
- apiGroups:
  {{- toYaml .apiGroups | nindent 2 }}
  resources:
  {{- toYaml .resources | nindent 2 }}
  verbs: [create, delete, get, list, patch, update, watch]
- apiGroups:
  {{- toYaml .apiGroups | nindent 2 }}
  resources:
  {{- range .resources }}
  - {{ . }}/finalizers
  {{- end }}
  verbs: [update]
- apiGroups:
  {{- toYaml .apiGroups | nindent 2 }}
  resources:
  {{- range .resources }}
  - {{ . }}/status
  {{- end }}
  verbs: [get, patch, update]
{{- end }}

# Resources needed for Valkey/OpenSearch controllers
- apiGroups: [aiven.io]
  resources: [valkeys, opensearches, serviceintegrations]
  verbs: [create, delete, get, list, patch, update, watch]

# Resources needed for Postgres controller
- apiGroups: [acid.zalan.do]
  resources: [postgresqls]
  verbs: [create, delete, get, list, patch, update, watch]
- apiGroups: [postgresql.cnpg.io]
  resources: [clusters, scheduledbackups, poolers]
  verbs: [create, delete, get, list, patch, update, watch]
- apiGroups: [iam.cnrm.cloud.google.com]
  resources: [iampolicymembers, iamserviceaccounts]
  verbs: [create, delete, get, list, patch, update, watch]
- apiGroups: [storage.cnrm.cloud.google.com]
  resources: [storagebuckets]
  verbs: [create, delete, get, list, patch, update, watch]
- apiGroups: [networking.k8s.io]
  resources: [networkpolicies]
  verbs: [create, delete, get, list, patch, update, watch]
- apiGroups: [monitoring.coreos.com]
  resources: [prometheusrules, podmonitors]
  verbs: [create, delete, get, list, patch, update, watch]
- apiGroups: [rbac.authorization.k8s.io]
  resources: [rolebindings]
  verbs: [create, delete, get, list, patch, update, watch]
- apiGroups: [rbac.authorization.k8s.io]
  resources: [clusterroles]
  verbs: [bind]
  resourceNames: [postgres-pod-additional]
- apiGroups: [""]
  resources: [serviceaccounts]
  verbs: [create, delete, get, list, patch, update, watch]
- apiGroups: [""]
  resources: [namespaces]
  verbs: [get, list, watch]

# Controller runtime requirements
- apiGroups: [coordination.k8s.io]
  resources: [leases]
  verbs: [create, delete, get, list, patch, update, watch]
- apiGroups: ["", events.k8s.io]
  resources: [events]
  verbs: [create, patch]
{{- end -}}
