apiVersion: logging.banzaicloud.io/v1beta1
kind: ClusterFlow
metadata:
  name: pgrator-loki-cnpg
spec:
  match:
    - select:
        labels:
          logs.nais.io/flow-cnpg: "true"
  filters:
    # pgaudit records go to team-logs only
    - grep:
        exclude:
          - key: message
            pattern: '/,"logger":"pgaudit",/'
    # drop empty messages
    - grep:
        exclude:
          - key: message
            pattern: "/^\\s*$/"
    # drop logs from debug containers
    - grep:
        exclude:
          - key: $.kubernetes.container_name
            pattern: /^debugger-.+/
    # mask ssn
    - record_modifier:
        records:
          - message: |
              ${ record['message'].gsub(/(^|[ '"\/&?=.,:\(\[\{])\d{11}([ '"\/&?=.,:\)\]\}]|$)/, '\1XXXXXXXXXXX\2') if record.has_key?('message') }
    - record_modifier:
        records:
          - nais_app_name: "${ record.dig('kubernetes', 'labels', 'postgres.nais.io/name') }"
            nais_service_namespace: "${ record.dig('kubernetes', 'namespace_name') }"
  globalOutputRefs:
    - logging-loki-management-tenant
