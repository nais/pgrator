dependencies:
  - allOf:
      - aiven-operator
      - cert-manager
      - cloudnative-image-catalog
      - cloudnative-pg
      - monitoring-crds
environmentKinds:
  - tenant
values:
  controllerManager.container.image.tag:
    displayName: Image tag
    config:
      type: string
  google.projectId:
    displayName: Google project ID
    computed:
      template: '"{{.Env.project_id}}"'
  apiServerIP:
    displayName: API server CIDR
    description: CIDR of the Kubernetes API server, allowed for egress from CNPG pods
    computed:
      template: '"{{ .Env.apiserver_endpoint }}/32"'
  resyncIAMPermissions:
    displayName: Resync IAM permissions
    description: Enable resyncing of IAM permissions by recreating IAMPolicyMember resources
    config:
      type: bool
  aiven.project:
    displayName: Aiven project name
    computed:
      template: "{{.Env.aiven_project | quote}}"
  aiven.projectVPCID:
    displayName: Aiven project VPC ID
    computed:
      template: '{{(splitList "/" .Env.aiven_project_vpc_id | last) | quote}}'
  aiven.metricsDestinationEndpointID:
    displayName: Aiven metrics destination endpoint ID
    computed:
      template: '{{(splitList "/" .Env.aiven_prometheus_endpoint_id | last) | quote}}'
  # CNPG settings
  cnpg.walBucketPrefix:
    displayName: Prefix to use for WAL storage buckets
    computed:
      # Owner names and a unique UID suffix are added within the 63-character GCS limit.
      template: 'nais-wal-{{ trunc 8 .Tenant.Name }}-{{ trunc 8 .Env.name }}'
